version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: chargesure
      POSTGRES_PASSWORD: chargesure
      POSTGRES_DB: chargesure
    ports:
      - "5432:5432"
    volumes:
      - chargesure_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chargesure"]
      interval: 5s
      timeout: 5s
      retries: 10

  osrm:
    image: osrm/osrm-backend:latest
    # Requires a pre-processed .osrm dataset mounted below (see README: "Setting up OSRM").
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - "5000:5000"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chargesure:chargesure@db:5432/chargesure
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      osrm:
        condition: service_started
    volumes:
      - ./app:/app/app

volumes:
  chargesure_pgdata:
